<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 118" width="1000" height="118" role="img" aria-label="Now shipping: four products, three countries."><title>Now shipping: four products, three countries.</title><style>@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'sans-sb';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'serif-i';src:url(data:font/woff2;base64,) format('woff2')}.f-mono{font-family:'mono'}.f-sans-sb{font-family:'sans-sb'}.f-serif-i{font-family:'serif-i'}
.rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.fade{animation:fade 1s ease both}
@keyframes fade{from{opacity:0}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleX(.84);opacity:.6}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(0)}}
.blink{animation:blink 2.7s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar 1.2s ease-in-out infinite}
@keyframes bar{50%{transform:scaleY(.22)}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.draw{animation:draw 2s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:1000}}
.slide{animation:slide linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><text x="4" y="34" fill="#9198a1" text-anchor="start" letter-spacing="2.4" xml:space="preserve" ><tspan class="f-mono" font-size="13">(NOW SHIPPING)</tspan></text><text x="0" y="92" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.6" xml:space="preserve" ><tspan class="f-sans-sb" font-size="44">Four products. </tspan><tspan class="f-serif-i" font-size="52">Three countries.</tspan></text><text x="996" y="92" fill="#9198a1" text-anchor="end" letter-spacing="1.6" xml:space="preserve" ><tspan class="f-mono" font-size="12">EACH CARD OPENS ITS CASE STUDY</tspan></text></svg>
